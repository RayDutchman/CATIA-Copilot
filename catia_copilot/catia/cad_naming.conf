# ============================================================
# CATIA Copilot — CAD 附件命名前缀配置
# ============================================================
# 用户可自定义 PDF / STP 附件的文件名前缀
# 命名格式：{前缀}{件号}_{版本}.{扩展名}
# ============================================================

# PDF 文件：零件类型前缀
CAD_PDF_PART_PREFIX=DR_

# PDF 文件：部件/装配类型前缀
CAD_PDF_ASSEMBLY_PREFIX=ASY_

# STP 文件前缀
CAD_STP_PREFIX=MD_
